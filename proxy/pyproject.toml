[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dabt-proxy"
version = "0.1.0"
description = "Reference MCP gate: evaluates an MCP tool call against Dabt policy before it executes"
authors = [{ name = "Abdulaziz Al-Dhamri", email = "abdulazizaldhamri@gmail.com" }]
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["dabt-core", "mcp>=2.0", "anyio>=4.0", "httpx>=0.27"]

[project.scripts]
dabt-proxy = "dabt_proxy.__main__:main"

[tool.setuptools.packages.find]
include = ["dabt_proxy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
