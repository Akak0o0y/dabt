    framework: PDPL
    citation:
      article: "Article 15(5)"
      quote: "The Disclosure will only involve subsequent Processing in a form that makes it impossible to directly or indirectly identify the Data Subject."
      source_url: "https://sdaia.gov.sa/en/SDAIA/about/Documents/Personal%20Data%20English%20V2-23April2023-%20Reviewed-.pdf"
    condition:
