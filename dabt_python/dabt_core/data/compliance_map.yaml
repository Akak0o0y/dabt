rules:
  - id: NDMO-TOP-SECRET-DENY
    priority: 10
    decision: DENY
    framework: NDMO
    citation:
      article: "Section 4.3 — Data Classification Levels"
      quote: "Data shall be classified as ‘Top Secret’, if unauthorized access to or disclosure of such data or its content adversely and exceptionally affects in a way that is difficult to resolve."
      source_url: "https://sdaia.gov.sa/ndmo/Files/PoliciesEn.pdf"
    condition:
      classification: "Top Secret"
    rationale_en: "Top Secret data requires the highest protection. This reference implementation denies agent retrieval pending a legally reviewed, purpose-specific exception." 
    rationale_ar: "تتطلب البيانات المصنفة «سري للغاية» أعلى درجات الحماية. يمنع هذا التطبيق المرجعي استرجاع الوكيل لها لحين وجود استثناء محدد الغرض ومراجع قانونياً."
    mapped_controls:
      - framework: NCA_ECC_2_2024
        control_id: "2-7"
        granularity: subdomain
        confidence_level: needs_verification
        requires_legal_review: true
      - framework: SAMA_CSF
        control_id: "3.3"
        granularity: subdomain
        confidence_level: needs_verification
        requires_legal_review: true
    sama_maturity_contribution: 3
    confidence_level: verified
    requires_legal_review: true

  - id: PDPL-ART6-4-SENSITIVE-LEGITIMATE-INTEREST
    priority: 20
    decision: DENY
    framework: PDPL
    citation:
      article: "Article 6(4)"
      quote: "If the Processing is necessary for the purpose of legitimate interest of the Controller, without prejudice to the rights and interests of the Data Subject, and provided that no Sensitive Data is to be processed."
      source_url: "https://sdaia.gov.sa/en/SDAIA/about/Documents/Personal%20Data%20English%20V2-23April2023-%20Reviewed-.pdf"
    condition:
      lawful_basis: legitimate_interest
      contains_sensitive_data: true
    rationale_en: "Legitimate interest cannot be used for Sensitive Data. The requested retrieval is therefore denied under the declared lawful basis."
    rationale_ar: "لا يجوز استخدام المصلحة المشروعة لمعالجة البيانات الحساسة. لذا يُمنع الاسترجاع المطلوب بموجب الأساس القانوني المعلن."
    mapped_controls:
      - framework: NCA_ECC_2_2024
        control_id: "2-7"
        granularity: subdomain
        confidence_level: needs_verification
        requires_legal_review: true
      - framework: NCA_ECC_2_2024
        control_id: "2-13"
        granularity: subdomain
        confidence_level: needs_verification
        requires_legal_review: true
      - framework: SAMA_CSF
        control_id: "3.2"
        granularity: subdomain
        confidence_level: needs_verification
        requires_legal_review: true
    sama_maturity_contribution: 3
    confidence_level: verified
    requires_legal_review: true

  - id: PDPL-ART15-6-SENSITIVE-DISCLOSURE
    priority: 30
    decision: DENY
    framework: PDPL
    citation:
      article: "Article 15(6)"
      quote: "The Disclosure is necessary to achieve legitimate interests of the Controller, without prejudice to the rights and interests of the Data Subject, and provided that no Sensitive Data is to be processed."
      source_url: "https://sdaia.gov.sa/en/SDAIA/about/Documents/Personal%20Data%20English%20V2-23April2023-%20Reviewed-.pdf"
    condition:
      event_type: disclosure
      lawful_basis: legitimate_interest
      contains_sensitive_data: true
    rationale_en: "A disclosure justified by legitimate interest cannot include Sensitive Data."
    rationale_ar: "لا يجوز أن يتضمن الإفصاح المستند إلى المصلحة المشروعة بيانات حساسة."
    mapped_controls:
      - framework: NCA_ECC_2_2024
        control_id: "2-7"
        granularity: subdomain
        confidence_level: needs_verification
        requires_legal_review: true
      - framework: SAMA_CSF
        control_id: "3.3"
        granularity: subdomain
        confidence_level: needs_verification
        requires_legal_review: true
    sama_maturity_contribution: 3
    confidence_level: verified
    requires_legal_review: true

  - id: PDPL-ART23-HEALTH-DATA-RESTRICTION
    priority: 40
    decision: REVIEW
    framework: PDPL
    citation:
      article: "Article 23(1)"
      quote: "Restricting the right to access Health Data, including medical files, to the minimum number of employees or workers and only to the extent necessary to provide the required Health Services."
      source_url: "https://sdaia.gov.sa/en/SDAIA/about/Documents/Personal%20Data%20English%20V2-23April2023-%20Reviewed-.pdf"
    condition:
      contains_sensitive_category: health
    rationale_en: "Health Data needs purpose-specific, minimum-access controls. Escalate to an authorised human reviewer before agent retrieval."
    rationale_ar: "تحتاج البيانات الصحية إلى ضوابط وصول محددة الغرض وبأقل نطاق. تُحال إلى مراجع بشري مخوّل قبل استرجاع الوكيل."
    mapped_controls:
      - framework: NCA_ECC_2_2024
        control_id: "2-2"
        granularity: subdomain
        confidence_level: needs_verification
        requires_legal_review: true
      - framework: NCA_ECC_2_2024
        control_id: "2-7"
        granularity: subdomain
        confidence_level: needs_verification
        requires_legal_review: true
    sama_maturity_contribution: 3
    confidence_level: verified
    requires_legal_review: true

  - id: PDPL-ART24-CREDIT-DATA-CONSENT
    priority: 50
    decision: REVIEW
    framework: PDPL
    citation:
      article: "Article 24(1)"
      quote: "Implementing appropriate measures to verify that the Data Subject has given their explicit consent to the Collection of the Personal Data, changing the purpose of the Collection, or Disclosure or Publishing of the Personal Data in accordance with the provisions of this Law and the Credit Information Law."
      source_url: "https://sdaia.gov.sa/en/SDAIA/about/Documents/Personal%20Data%20English%20V2-23April2023-%20Reviewed-.pdf"
    condition:
      contains_sensitive_category: credit
    rationale_en: "Credit Data requires explicit-consent verification and is routed for review in this reference implementation."
    rationale_ar: "تتطلب البيانات الائتمانية التحقق من الموافقة الصريحة، ولذلك تُحال للمراجعة في هذا التطبيق المرجعي."
