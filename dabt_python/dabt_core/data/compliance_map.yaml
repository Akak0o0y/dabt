      confidence_level: inferred
      requires_legal_review: true

  - id: NDMO-PUBLIC-ALLOW
    priority: 900
    decision: ALLOW
    framework: NDMO
    citation:
      article: "Section 4.3 — Data Classification Levels"
      quote: "Data shall be classified as ‘Public’, if unauthorized access to or disclosure of such data or its content has no impact on: National Interest, or Organizations, or Individuals, or Environment."
      source_url: "https://sdaia.gov.sa/ndmo/Files/PoliciesEn.pdf"
    condition:
      classification: Public
      surface: retrieval
    rationale_en: "The document is classified Public by the available data. Permit the requested retrieval while retaining an auditable decision record."
    rationale_ar: "يصنّف المستند علنياً وفق البيانات المتاحة. يُسمح بالاسترجاع المطلوب مع الاحتفاظ بسجل قرار قابل للتدقيق."
    mapped_controls:
