  - id: NDMO-SECRET-RESTRICTED-ACCESS
    priority: 230
    decision: ALLOW_WITH_REDACTION
    framework: NDMO
    citation:
      article: "Section 4.2 — Principle 6: Need to Know"
      quote: "Access to data should be provided only if there is legitimate requirement for usage of the data based on authorization and access controls and for the least number of people possible."
      source_url: "https://sdaia.gov.sa/ndmo/Files/PoliciesEn.pdf"
    condition:
      classification: Secret
      agent_authorised: true
    rationale_en: "Secret data requires need-to-know access. This reference path redacts detected identifiers and records the decision for review."
    rationale_ar: "تتطلب البيانات السرية وصولاً على أساس الحاجة إلى المعرفة. يحجب هذا المسار المرجعي المعرّفات المكتشفة ويسجل القرار للمراجعة."
    mapped_controls:
