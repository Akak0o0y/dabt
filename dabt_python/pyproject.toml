[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dabt-core"
version = "0.1.0"
description = "Research-grounded Saudi privacy policy engine for AI data retrieval"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "fastapi>=0.115", "uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
